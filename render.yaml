services:
  # ============================
  # API / BACKEND
  # ============================
  - type: web
    name: marketplace-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # ============================
  # FRONTEND / SITE
  # ============================
  - type: web
    name: marketplace-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://marketplace-api.onrender.com
      - key: NODE_VERSION
        value: 20.11.0

# ============================
# BANCO DE DADOS
# ============================
databases:
  - name: marketplace-db
    plan: free
    databaseName: marketplace
    user: marketplace
